name: Build signed Legacy Music APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Repack APK with the version from VERSION
        run: python3 tools/build.py build/unsigned.apk

      - name: Compile the fixed Java classes (./java) and inject them into the APK
        run: python3 tools/inject_java.py build/unsigned.apk

      - name: Get signing key (from GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > build/release.keystore
            echo "Using the keystore from secrets."
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - creating a NEW key. Phones with the app installed will NOT be able to update. Save the NEW-KEYSTORE artifact and add it as a secret."
            keytool -genkeypair -keystore build/release.keystore -storepass legacy123456 -keypass legacy123456 \
              -alias legacymusic -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Legacy Music, O=Legacy, C=IN"
            echo "NEWKEY=1" >> "$GITHUB_ENV"
          fi

      - name: Zipalign + sign (v2 + v3) and verify
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'legacy123456' }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS || 'legacymusic' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'legacy123456' }}
        run: |
          curl -sL -o build/uas.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar build/uas.jar -a build/unsigned.apk --ks build/release.keystore \
            --ksAlias "$KS_ALIAS" --ksPass "$KS_PASS" --ksKeyPass "$KEY_PASS" --allowResign --out build/signed
          cp build/signed/unsigned-aligned-signed.apk LegacyMusic.apk
          java -jar build/uas.jar -y --onlyVerify -a LegacyMusic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LegacyMusic-apk
          path: LegacyMusic.apk
      - if: env.NEWKEY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: NEW-KEYSTORE-SAVE-THIS
          path: build/release.keystore
